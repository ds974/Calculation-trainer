<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Icône accueil orbitale</title>
  <desc id="desc">Icône ronde teal doux avec une petite maison blanche entourée d’un anneau orbital.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3C7A8B"/>
      <stop offset="100%" stop-color="#2C5B6A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#12313B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="56" fill="url(#bg)"/>

  <!-- petites étoiles -->
  <circle cx="38" cy="42" r="2.4" fill="#D7EEF5" opacity="0.95"/>
  <circle cx="91" cy="87" r="2.2" fill="#D7EEF5" opacity="0.9"/>
  <circle cx="88" cy="35" r="1.8" fill="#D7EEF5" opacity="0.75"/>

  <!-- anneau orbital -->
  <g transform="rotate(-17 64 64)">
    <ellipse cx="64" cy="64" rx="35" ry="14.5" fill="none" stroke="#A8D4DF" stroke-width="5" opacity="0.95"/>
    <ellipse cx="64" cy="64" rx="35" ry="14.5" fill="none" stroke="#E7F8FC" stroke-width="1.4" opacity="0.7"/>
    <circle cx="30" cy="64" r="4.2" fill="#EAFBFF"/>
  </g>

  <!-- maison -->
  <g filter="url(#shadow)">
    <path d="M45 65 L64 49 L83 65" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 63 V83 H78 V63" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 83 V69 H68 V83" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
